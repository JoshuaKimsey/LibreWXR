name: Publish Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/joshuakimsey/librewxr,push-by-digest=true,name-canonical=true,push=true

      - name: Prepare
        run: |
          PLATFORM_PAIR=${platform//\//-}
          echo "PLATFORM_PAIR=${PLATFORM_PAIR}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    steps:
      # metadata-action's semver tags read the git tag, so the checkout has
      # to keep it reachable.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for GHCR
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/joshuakimsey/librewxr
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          # metadata-action's JSON output, passed through env so the shell
          # sees it as a single value instead of raw JSON spliced into the
          # script text.
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON")
          docker buildx imagetools create $TAGS \
            $(printf 'ghcr.io/joshuakimsey/librewxr@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/joshuakimsey/librewxr:${{ steps.meta.outputs.version }}
