name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -uo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          fail=0

          for sha in $(git rev-list "$base..$head"); do
            # Skip merge commits: they have more than one parent.
            parents=$(git show -s --format='%P' "$sha")
            case "$parents" in
              *' '*) continue ;;
            esac

            subject=$(git show -s --format='%s' "$sha")
            author=$(git show -s --format='%an <%ae>' "$sha")
            trailer=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            if [ -z "$trailer" ]; then
              echo "FAIL: $sha - $subject - missing Signed-off-by trailer"
              fail=1
            elif [ "$trailer" != "$author" ]; then
              echo "FAIL: $sha - $subject - Signed-off-by '$trailer' does not match author '$author'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "DCO check failed: one or more commits are not signed off correctly."
            echo "Every commit must carry a 'Signed-off-by:' line whose name and email"
            echo "match the commit author identity (see CONTRIBUTING.md)."
            echo "Fix with 'git commit -s --amend' (or rebase), then push again."
            exit 1
          fi

          echo "DCO check passed: all non-merge commits carry a valid Signed-off-by trailer."